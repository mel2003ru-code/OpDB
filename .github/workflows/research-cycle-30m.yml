name: OpDB Foundry 30-minute research checks
on:
  push:
    branches: [main]
  schedule:
    # At :07 and :37 UTC; GitHub may delay scheduled workflows.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opdb-research-cycle-30m
  cancel-in-progress: false

jobs:
  reproducible-checks:
    if: github.repository == 'mel2003ru-code/OpDB'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests including research-cycle runner
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run independent configured SQLite checks
        run: python -m research.cycle --output research-cycle.json
      - name: Retain complete evidence in GitHub Actions logs, no artifact quota
        if: always()
        shell: bash
        run: |
          if [ -s research-cycle.json ]; then
            cat research-cycle.json
          else
            echo "No machine-readable result was generated"
          fi
  notify-failure:
    if: ${{ always() && needs.reproducible-checks.result == 'failure' }}
    needs: reproducible-checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Alert once per day in Issue 17
        uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const {owner,repo} = context.repo;
            const utcDay = new Date().toISOString().slice(0,10);
            const marker = "<!-- opdb-research-alert:" + utcDay + " -->";
            const runUrl = "https://github.com/"+owner+"/"+repo+"/actions/runs/"+context.runId;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner,repo,issue_number:17,per_page:100});
            const old = comments.find(x=>x.body?.includes(marker));
            const known = new Set((old?.body||"").match(/https:\/\/github\.com\/[^\s)]+\/actions\/runs\/\d+/g)||[]);
            known.add(runUrl);
            const urls = [...known].slice(-12);
            const msg = [marker, "## OpDB research checks — CI failures ("+utcDay+" UTC)",
              "", "A scheduled SQLite/model test failed. This does not mean a native OpDB",
              "database regression until reproduced on the relevant engine code.",
              "", ...urls.map(x=>"- [Inspect failing run]("+x+")"),
              "", "Do not merge safety-critical changes based solely on green metadata CI."].join("\n");
            if (old) {
              await github.rest.issues.updateComment({owner,repo,comment_id:old.id,body:msg});
            } else {
              await github.rest.issues.createComment({owner,repo,issue_number:17,body:msg});
            }
