name: OpDB Foundry 30-minute research checks
on:
  push:
    branches: [main]
  schedule:
    # At :07 and :37 UTC; GitHub may delay scheduled workflows.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opdb-research-cycle-30m
  cancel-in-progress: false

jobs:
  reproducible-checks:
    if: github.repository == 'mel2003ru-code/OpDB'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests including research-cycle runner
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run independent configured SQLite checks
        run: python -m research.cycle --output research-cycle.json
      - name: Retain complete evidence in GitHub Actions logs, no artifact quota
        if: always()
        shell: bash
        run: |
          if [ -s research-cycle.json ]; then
            cat research-cycle.json
          else
            echo "No machine-readable result was generated"
          fi
