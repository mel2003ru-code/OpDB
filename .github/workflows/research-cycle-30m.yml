name: OpDB Foundry 30-minute research checks
on:
  schedule:
    # At :07 and :37 UTC; GitHub may delay scheduled workflows.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opdb-research-cycle-30m
  cancel-in-progress: false

jobs:
  reproducible-checks:
    if: github.repository == 'mel2003ru-code/OpDB'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests including research-cycle runner
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run independent configured SQLite checks
        run: python -m research.cycle --output research-cycle.json
      - name: Preserve machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opdb-research-cycle
          path: research-cycle.json
          retention-days: 7
          if-no-files-found: ignore
