name: Foundry metadata checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-handoff-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check handoff template schema
        run: python scripts/validate_handoff.py workstreams/HANDOFF_TEMPLATE.json
      - name: Run metadata-only unit tests
        run: python -m unittest discover -s tests -p 'test_handoff_*.py' -v
