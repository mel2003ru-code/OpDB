name: Foundry CI — metadata and research tests
on:
  # CI runs on pull requests only. `main` requires up-to-date branches, so the
  # PR run already tested the exact tree that gets merged; a second run on push
  # only spent Actions minutes.
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: foundry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-handoff-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check handoff template schema
        run: python scripts/validate_handoff.py workstreams/HANDOFF_TEMPLATE.json
      - name: Run all repository unit tests, including bounded SQLite research probes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Rust core tests
        working-directory: rust/opdb-core
        run: cargo test --offline
