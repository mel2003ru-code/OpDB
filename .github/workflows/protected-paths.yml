name: Protected files
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: protected-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to protected files without owner approval
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}
        run: python scripts/check_protected_paths.py "$BASE_SHA" "$HEAD_SHA" "$APPROVED"
