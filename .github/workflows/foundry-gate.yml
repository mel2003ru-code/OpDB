name: Foundry gated research preflight
on:
  pull_request:
    paths:
      - 'foundry/**'
      - 'tests/test_foundry_control.py'
      - 'tests/test_foundry_loop.py'
      - 'tests/test_launch_gate.py'
      - 'tests/test_agent_executor.py'
      - 'tests/test_issue_intake.py'
      - '.github/workflows/foundry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  evidence-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate for isolated verification only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise negative and synthetic victory cases
        run: python -m unittest -v tests.test_foundry_control tests.test_foundry_loop tests.test_launch_gate tests.test_agent_executor tests.test_issue_intake
      - name: Demand explicit NOT_CONFIGURED without real evidence
        shell: bash
        run: |
          python -m foundry.control --output foundry-decision.json
          python -c 'import json; d=json.load(open("foundry-decision.json")); assert d["state"] == "NOT_CONFIGURED" and not d["production_allowed"] and not d["pause_autonomous_improvements"]'
      - name: Run fixed-seed reference research for actual report integration
        run: python -m research.cycle --seed 20261108 --output foundry-research.json
      - name: Produce one deterministic safe next step from research evidence
        shell: bash
        run: |
          python -m foundry.loop --research foundry-research.json --expected-sha "$GITHUB_SHA" --output foundry-next-step.json
          python -c 'import json; p=json.load(open("foundry-next-step.json")); assert p["state"] == "REQUEST_EXECUTABLE_ADAPTER" and p["next_issue"] == 3 and not p["automatic_merge_allowed"] and not p["production_deploy_allowed"]'
      - name: Print machine-readable plan or explicit failure
        if: always()
        shell: bash
        run: |
          if [ -s foundry-next-step.json ]; then
            cat foundry-next-step.json
          else
            echo "No complete Foundry decision produced (research must not advance)"
          fi
      - name: Explicitly forbid launch until real authenticated release evidence
        shell: bash
        run: |
          python -m foundry.launch_gate --output launch-readiness.json
          python -c 'import json; r=json.load(open("launch-readiness.json")); assert r["state"] == "NOT_READY" and not r["button_enabled"] and not r["launch_authorized"] and not r["launched"] and r["launched_at_utc"] is None'
      - name: Retrieve actual GitHub tracking Issue #31 (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/31" > actual-issue-31.json
      - name: Admit only approved issue metadata, never issue instructions
        shell: bash
        run: |
          python -m foundry.issue_intake --issue-json actual-issue-31.json --expected-sha "$GITHUB_SHA" --output admitted-task.json
          python -m foundry.agent_executor --task-file admitted-task.json --expected-sha "$GITHUB_SHA" --output admitted-demo.json
          python -c 'import json; a=json.load(open("admitted-demo.json")); assert a["state"] == "DRAFT_PROPOSAL_READY" and a["negative_control_failed_as_expected"] and a["candidate_tests_passed"] and not a["model_invoked"] and not a["repository_modified"] and not a["pull_request_created"] and not a["production_allowed"] and not a["launch_authorized"]'
      - name: Exercise bounded offline executor on a trusted synthetic task
        shell: bash
        run: |
          python -m foundry.agent_executor --expected-sha "$GITHUB_SHA" --demo-task --output executor-demo.json
          python -c 'import json; p=json.load(open("executor-demo.json")); assert p["state"] == "DRAFT_PROPOSAL_READY" and p["negative_control_failed_as_expected"] and p["candidate_tests_passed"] and p["candidate_diff_sha256"] and not p["model_invoked"] and not p["repository_modified"] and not p["pull_request_created"] and not p["production_allowed"] and not p["launch_authorized"]'
          git diff --exit-code
      - name: Check absence of untracked files in tracked source folders
        shell: bash
        run: |
          test -z "$(git ls-files --others --exclude-standard -- foundry tests)"
      - name: Explain trust boundary
        run: echo "No actual adapter verified, no external benchmark executed, no automatic release, merge or deployment."
