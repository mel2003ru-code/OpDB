name: Foundry Sandbox — actual fixed probe, no untrusted code

on:
  pull_request:
    paths:
      - 'foundry/sandbox*.py'
      - 'foundry/fixtures/sandbox_runtime_probe.py'
      - 'tests/test_sandbox_smoke.py'
      - 'tests/test_sandbox_policy.py'
      - 'tests/test_sandbox_negative.py'
      - '.github/workflows/foundry-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-runtime-probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # Reviewed PR image lock: observed in fixed probe run #42482546241.
      # Image digest pin is reproducibility, NOT independent publisher attestation.
      OPDB_TEST_IMAGE: python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
    steps:
      - name: Checkout candidate code without stored GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate safe planning and synthetic failure guards
        run: python -m unittest -v tests.test_sandbox_policy tests.test_sandbox_smoke tests.test_sandbox_negative
      - name: Confirm disposable Docker daemon available
        shell: bash
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Fetch exact reviewed OCI image digest, never moving tag
        shell: bash
        run: |
          docker pull --platform linux/amd64 "$OPDB_TEST_IMAGE"
          docker image inspect "$OPDB_TEST_IMAGE" --format '{{json .RepoDigests}}'
      - name: Execute ONLY fixed reviewed confinement fixture in a real container
        shell: bash
        run: |
          python -m foundry.sandbox_smoke \
            --image "$OPDB_TEST_IMAGE" \
            --fixture "$GITHUB_WORKSPACE/foundry/fixtures" \
            --output fixed-sandbox-evidence.json
          python - <<'PY'
          import json
          with open("fixed-sandbox-evidence.json", encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["state"] == "OBSERVED_FIXED_PROBE_PASS"
          assert report["runtime_confinement_observed"] is True
          assert len(report["checks"]) == 11
          assert all(value is True for value in report["checks"].values())
          assert report["untrusted_model_code_allowed"] is False
          assert report["candidate_executed"] is False
          assert report["github_write_allowed"] is False
          assert report["production_allowed"] is False
          assert report["automatic_merge_allowed"] is False
          assert report["launch_authorized"] is False
          PY
      - name: Negative control — intentionally remove read-only root flag
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from foundry.sandbox_policy import plan
          policy = plan(
              os.environ["OPDB_TEST_IMAGE"],
              str(Path(os.environ["GITHUB_WORKSPACE"]) / "foundry" / "fixtures"),
              12, probe="confinement",
          )
          assert policy["state"] == "POLICY_PLAN_ONLY"
          argv = [arg for arg in policy["command_argv"] if arg != "--read-only"]
          assert len(argv) == len(policy["command_argv"]) - 1
          result = subprocess.run(argv, capture_output=True, text=True, timeout=12)
          report = json.loads(result.stdout.strip())
          assert result.returncode != 0
          assert report["probe"] == "synthetic-fixed-review-only"
          assert report["passed"] is False
          assert report["checked"]["root_filesystem_read_only"] is False
          assert report["checked"]["network_only_loopback"] is True
          print("EXPECTED_NEGATIVE_CONTROL: removing --read-only was detected")
          PY
      - name: Three real negative controls — network, non-root UID and memory budget
        shell: bash
        run: |
          python -m foundry.sandbox_negative \
            --image "$OPDB_TEST_IMAGE" \
            --fixture "$GITHUB_WORKSPACE/foundry/fixtures" \
            --output sandbox-negative-evidence.json
          python - <<'PY'
          import json
          with open("sandbox-negative-evidence.json", encoding="utf-8") as handle:
              report=json.load(handle)
          assert report["state"] == "EXPECTED_FAILURES_OBSERVED"
          assert report["expected_failures_observed"] is True
          assert set(report["negative_controls"]) == {"network", "non_root", "memory"}
          for value in report["negative_controls"].values():
              assert value["detected_unsafe"] is True
              assert value["guest_exit_nonzero"] is True
          assert report["untrusted_model_code_allowed"] is False
          assert report["candidate_executed"] is False
          assert report["github_write_allowed"] is False
          assert report["automatic_merge_allowed"] is False
          assert report["production_allowed"] is False
          assert report["launch_authorized"] is False
          print("EXPECTED_NEGATIVE_CONTROLS: network, UID, memory detected")
          PY
      - name: Preserve evidence in immutable CI log while Actions artifact quota is exhausted
        if: always()
        shell: bash
        run: |
          for evidence in fixed-sandbox-evidence.json sandbox-negative-evidence.json; do
            if [ -s "$evidence" ]; then
              echo "=== $evidence / source SHA $GITHUB_SHA ==="
              cat "$evidence"
            else
              echo "MISSING_EVIDENCE: $evidence"
            fi
          done
          # This reporting step never overrides the outcome of failed preceding checks.
      - name: Confirm source checkout remains unmodified
        run: git diff --exit-code
      - name: Declare exact evidence boundary
        run: echo "Observed fixed synthetic Docker probe only. Digest is now pinned and reproducible, but NOT independent supply-chain approved. No LLM, arbitrary patches, real agent sandbox attestation, production, merge or launch."
